name: Build llama-diffusion CUDA 13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout llama.cpp b10488
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: b10488
          fetch-depth: 1

      - name: Install CUDA 13.3
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.3'

      - name: Install Ninja
        shell: powershell
        run: choco install ninja -y

      - name: Configure and build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_CUDA=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON

          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1

          cmake --build build --config Release -j %NINJA_JOBS% --target llama-diffusion-cli

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact

          Copy-Item "build\bin\Release\*.exe" artifact -ErrorAction SilentlyContinue
          Copy-Item "build\bin\Release\*.dll" artifact -ErrorAction SilentlyContinue

          Copy-Item "$env:CUDA_PATH\bin\cudart64_*.dll" artifact -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH\bin\cublas64_*.dll" artifact -ErrorAction SilentlyContinue
          Copy-Item "$env:CUDA_PATH\bin\cublasLt64_*.dll" artifact -ErrorAction SilentlyContinue

          Get-ChildItem artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-diffusion-b10488-win-cuda13.3-x64
          path: artifact
